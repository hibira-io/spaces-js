# The workflows' actions are pinned to a commit. Once a month Dependabot
# moves the pins in one grouped pull request and keeps the version comment
# beside each. Package security updates come from the organization's
# Dependabot settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] }
